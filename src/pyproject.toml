[project]
name = "hermes-business-agent"
version = "0.1.0"
description = "Hermes production runtime tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "azure-identity>=1.25,<2",
  "azure-keyvault-secrets>=4.11,<5",
  "azure-search-documents>=11.6,<12",
  "azure-storage-blob>=12.25,<13",
  "crawl4ai>=0.9,<0.10",
  "google-api-python-client>=2.199,<3",
  "google-auth-oauthlib>=1.4,<2",
  "pyinstaller>=6,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
]
