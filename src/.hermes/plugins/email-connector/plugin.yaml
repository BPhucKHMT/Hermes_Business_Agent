name: email-connector
label: Generic Multi-User Email Connector
kind: standalone
version: 0.2.0
description: Read-only Gmail search, thread inspection, and connection status for the resolved caller.
author: Hermes project team
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - email_search
  - email_get_thread
  - email_connection_status
provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
  - on_session_finalize
